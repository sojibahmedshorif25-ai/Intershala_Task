<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="gallery-title">Image Gallery</h1>

    <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
        <button class="filter-btn" data-filter="travel">Travel</button>
    </div>

    <div class="gallery" id="gallery">
        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/seed/nature1/400/300" alt="Nature 1">
            <div class="overlay">
                <span>Mountain Sunset</span>
            </div>
        </div>
        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/seed/animal1/400/300" alt="Animal 1">
            <div class="overlay">
                <span>Wild Fox</span>
            </div>
        </div>
        <div class="gallery-item" data-category="travel">
            <img src="https://picsum.photos/seed/travel1/400/300" alt="Travel 1">
            <div class="overlay">
                <span>Paris Streets</span>
            </div>
        </div>
        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/seed/nature2/400/300" alt="Nature 2">
            <div class="overlay">
                <span>Ocean Waves</span>
            </div>
        </div>
        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/seed/animal2/400/300" alt="Animal 2">
            <div class="overlay">
                <span>Forest Bird</span>
            </div>
        </div>
        <div class="gallery-item" data-category="travel">
            <img src="https://picsum.photos/seed/travel2/400/300" alt="Travel 2">
            <div class="overlay">
                <span>Tokyo Night</span>
            </div>
        </div>
        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/seed/nature3/400/300" alt="Nature 3">
            <div class="overlay">
                <span>Autumn Forest</span>
            </div>
        </div>
        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/seed/animal3/400/300" alt="Animal 3">
            <div class="overlay">
                <span>Butterfly</span>
            </div>
        </div>
        <div class="gallery-item" data-category="travel">
            <img src="https://picsum.photos/seed/travel3/400/300" alt="Travel 3">
            <div class="overlay">
                <span>Santorini</span>
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn">&times;</button>
        <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
        <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
        <img src="" alt="Lightbox Image" id="lightboxImg">
    </div>

    <script src="script.js"></script>
</body>
</html>
